<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生词笔记 · 考研五书词汇</title>
<link rel="stylesheet" href="assets/css/base.css?v=18">
<style>
/* 日期选择器：收起显示所选日期，点开是一列日期（每页 15 天），选哪天只显示哪天 */
.datesel {
  width: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 14px 18px; border: 1px solid var(--accent); border-radius: 12px;
  background: var(--bg-card); color: var(--ink); cursor: pointer; font-size: 16.5px;
  font-weight: 600; text-align: left; box-shadow: var(--shadow);
}
.datesel:hover { background: var(--bg-inset); }
.datesel .caret { margin-left: auto; color: var(--accent); font-size: 13px; transition: transform .15s; }
.datesel.on .caret { transform: rotate(90deg); }
.datesel .selcount { color: var(--accent); font-size: 14px; font-weight: 600; }
.datelist { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-card); margin: 10px 0; overflow: hidden; box-shadow: var(--shadow); }
.drow { display: flex; align-items: center; gap: 10px; padding: 13px 18px; cursor: pointer; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.drow:last-child { border-bottom: 0; }
.drow:hover { background: var(--bg-inset); }
.drow.sel { background: var(--accent); color: var(--accent-ink); }
.drow.sel .dcount, .drow.sel .dpage { color: var(--accent-ink); }
.drow .dtitle { font-weight: 600; font-size: 15.5px; }
.drow .dcount { color: var(--accent); font-size: 14px; font-weight: 600; }
.drow .dpage { margin-left: auto; color: var(--ink-2); font-size: 13px; }
.pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.pager .btn { padding: 6px 18px; font-size: 14px; }
.pginfo { color: var(--ink-2); font-size: 14px; white-space: nowrap; }

/* 所选日期的笔记 */
.daycard { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-card); margin: 14px 0; padding: 6px 16px 16px; box-shadow: var(--shadow); }
.dayhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 10px 2px 6px; border-bottom: 1px solid var(--line); }
.dayhead h3 { margin: 0; }
.dayhead .nmeta { color: var(--ink-2); font-size: 13.5px; }

/* 词卡 */
.note-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 10px; margin-top: 10px; }
.nw { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--bg-inset); }
.nw-top { display: flex; align-items: baseline; gap: 8px; }
.nw-w { font-size: 19px; }
.nw-rank { font-size: 12px; color: var(--warn); letter-spacing: 1px; margin-left: auto; white-space: nowrap; }
.nw .phon-row { margin: 6px 0 4px; gap: 14px; }
.acc { font-style: normal; font-size: 11px; color: var(--accent); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.nw-gloss { font-size: 14.5px; margin: 4px 0 0; }
.nw-gloss i { color: var(--ink-2); }
.nw-pts { margin: 7px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-2); }
.nw-pts li { margin: 3px 0; }
.nw-memo { margin-top: 7px; font-size: 13.5px; color: var(--warn); }
.nw-rel { margin-top: 5px; font-size: 13px; color: var(--ink-2); }
.ng { border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 14px; margin-top: 10px; background: var(--bg-inset); }
.ng-title { font-weight: 600; color: var(--accent); margin-bottom: 6px; }
.ng-w { display: block; margin: 5px 0; font-size: 14.5px; line-height: 1.6; }
</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html">📚 五书词汇</a>
  <a class="tab" href="index.html">今日</a>
  <a class="tab" href="browse.html">词库</a>
  <a class="tab" href="wordbook.html">生词本</a>
  <a class="tab active" href="notes.html">生词笔记</a>
  <a class="tab" href="stats.html">统计</a>
  <a class="tab" href="settings.html">设置</a>
  <span class="spacer"></span>
  <button class="iconbtn" id="themeBtn" title="切换深浅色">🌙</button>
</nav>

<main>
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">📖 生词笔记</h2>
      <span id="noteSummary" style="margin-left:auto;color:var(--ink-2);font-size:14px"></span>
    </div>
    <p style="color:var(--ink-2);font-size:13.5px;margin:8px 0 0">点开下方日期选择当天笔记 · 点击 🔊 听英 / 美发音</p>
  </div>

  <button class="datesel" id="dateSel" aria-expanded="false"></button>
  <div class="datelist" id="dateList" hidden></div>
  <div id="dayView"></div>
</main>

<script type="module">
import { initTheme, setTheme, getTheme, icon, bindAudioButtons } from './assets/js/ui.js?v=17';
import { initAudio, pronounce, prefetchRealAudio } from './assets/js/audio.js?v=17';

initTheme(); initAudio();
document.getElementById('themeBtn').textContent = getTheme() === 'dark' ? '☀️' : '🌙';
document.getElementById('themeBtn').onclick = () => {
  const next = getTheme() === 'dark' ? 'light' : 'dark';
  setTheme(next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};
const $ = id => document.getElementById(id);

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const WEEK = ['日','一','二','三','四','五','六'];
const PAGE_SIZE = 15;              // 日期每页天数，超出自动分页

function noteWordCard(w) {
  const ph = w.ph || {};
  return `<div class="nw">
    <div class="nw-top"><b class="nw-w">${esc(w.w)}</b>${w.rank ? `<span class="nw-rank">${'★'.repeat(w.rank)}</span>` : ''}</div>
    <div class="phon-row">
      ${ph.uk ? `<span class="phon"><button class="btn-audio" data-acc="uk" data-w="${esc(w.w)}" aria-label="${esc(w.w)} 英音">${icon('uk')}</button><span class="ph-text">/${esc(ph.uk)}/</span><i class="acc">英</i></span>` : ''}
      ${ph.us ? `<span class="phon"><button class="btn-audio" data-acc="us" data-w="${esc(w.w)}" aria-label="${esc(w.w)} 美音">${icon('us')}</button><span class="ph-text">/${esc(ph.us)}/</span><i class="acc">美</i></span>` : ''}
    </div>
    <div class="nw-gloss"><i>${esc(w.pos || '')}</i> ${esc(w.gloss || '')}</div>
    ${(w.points && w.points.length) ? `<ul class="nw-pts">${w.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
    ${w.memo ? `<div class="nw-memo">💡 ${esc(w.memo)}</div>` : ''}
    ${w.rel ? `<div class="nw-rel">${esc(w.rel)}</div>` : ''}
  </div>`;
}

function noteGroupCard(g) {
  return `<div class="ng">
    <div class="ng-title">⚡ 易混辨析 · ${esc(g.title)}</div>
    ${(g.words || []).map(x => `<span class="ng-w"><b>${esc(x.w)}</b> <button class="btn-audio" data-acc="uk" data-w="${esc(x.w)}" aria-label="${esc(x.w)} 发音">${icon('uk')}</button> <span class="ph-text">/${esc(x.ph || '')}/</span> ${esc(x.gloss || '')}${x.tip ? ` — ${esc(x.tip)}` : ''}</span>`).join('')}
    ${g.memo ? `<div class="nw-memo">💡 ${esc(g.memo)}</div>` : ''}
  </div>`;
}

let days = [];                     // 全部日期（降序，最新在前）
const pg = { cur: 0, total: 1 };
let selDate = null, listOpen = false;

const wd = d => { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? '' : ' 周' + WEEK[t.getDay()]; };

function renderSel() {
  const rec = days.find(d => d.date === selDate);
  if (!rec) { $('dateSel').innerHTML = '📅 选择日期'; return; }
  $('dateSel').innerHTML = `📅 ${esc(rec.date)}${wd(rec.date)} <span class="selcount">${(rec.words || []).length} 词</span> <span class="caret">${listOpen ? '▾' : '▸'}</span>`;
  $('dateSel').classList.toggle('on', listOpen);
  $('dateSel').setAttribute('aria-expanded', listOpen);
}

function renderList() {
  const start = pg.cur * PAGE_SIZE;
  const slice = days.slice(start, start + PAGE_SIZE);
  const rows = slice.map(d => `<div class="drow${d.date === selDate ? ' sel' : ''}" data-date="${esc(d.date)}" role="button" tabindex="0">
      <span class="dtitle">📝 ${esc(d.date)}${wd(d.date)}</span>
      <span class="dcount">${(d.words || []).length} 词</span>
      <span class="dpage">${esc(d.label || '')}</span>
    </div>`).join('');
  const pager = pg.total > 1 ? `<div class="pager">
      <button class="btn pgbtn" data-pg="${pg.cur - 1}" ${pg.cur === 0 ? 'disabled' : ''}>‹ 上一页</button>
      <span class="pginfo">第 ${pg.cur + 1} / ${pg.total} 页</span>
      <button class="btn pgbtn" data-pg="${pg.cur + 1}" ${pg.cur === pg.total - 1 ? 'disabled' : ''}>下一页 ›</button>
    </div>` : '';
  $('dateList').innerHTML = rows + pager;
}

function renderDay() {
  const rec = days.find(d => d.date === selDate);
  if (!rec) { $('dayView').innerHTML = ''; return; }
  const words = rec.words || [], groups = rec.groups || [];
  $('dayView').innerHTML = `<section class="daycard">
    <div class="dayhead">
      <h3>📝 ${esc(rec.date)}${wd(rec.date)}</h3>
      <span class="nmeta">${words.length} 词 · ${esc(rec.label || '')}</span>
    </div>
    <div class="note-grid">${words.map(noteWordCard).join('')}</div>
    ${groups.map(noteGroupCard).join('')}
  </section>`;
  for (const w of words) prefetchRealAudio(w.w);
}

function setListOpen(v) {
  listOpen = v;
  $('dateList').hidden = !v;
  renderSel();
}

async function load() {
  let j = null;
  const v = new Date().toISOString().slice(0, 10).replace(/-/g, '');   // 日期版缓存击穿
  try { const r = await fetch(`data/notes.json?v=${v}`); if (r.ok) j = await r.json(); } catch (e) {}
  const raw = (j && Array.isArray(j.notes)) ? j.notes : [];
  if (!raw.length) {
    $('dateSel').hidden = true;
    $('dayView').innerHTML = '<div class="card"><p style="color:var(--ink-2);margin:6px 0">暂无生词笔记</p></div>';
    return;
  }
  const total = raw.reduce((n, d) => n + (d.words || []).length, 0);
  $('noteSummary').textContent = `共 ${raw.length} 天 · ${total} 词`;
  days = [...raw].sort((a, b) => String(b.date).localeCompare(String(a.date)));   // 最新在前
  pg.total = Math.max(1, Math.ceil(days.length / PAGE_SIZE));
  pg.cur = 0;
  selDate = days[0].date;         // 默认选最新一天
  renderSel(); renderList(); renderDay();
}

/* 交互 */
$('dateSel').addEventListener('click', () => setListOpen(!listOpen));

$('dateList').addEventListener('click', e => {
  const pgbtn = e.target.closest('.pgbtn');
  if (pgbtn && !pgbtn.disabled) {
    const next = Number(pgbtn.dataset.pg);
    if (!Number.isNaN(next) && next >= 0 && next < pg.total) { pg.cur = next; renderList(); }
    return;
  }
  const row = e.target.closest('.drow');
  if (!row) return;
  selDate = row.dataset.date;
  renderSel(); renderList(); renderDay();
  setListOpen(false);             // 选完日期收起列表，只显示所选那天
});

bindAudioButtons(document, pronounce);
load();
</script>
</body>
</html>
