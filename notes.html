<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生词笔记 · 考研五书词汇</title>
<link rel="stylesheet" href="assets/css/base.css?v=18">
<style>
/* 点开式日期列表（手风琴）：日期由上到下，最新在最上，点哪天展开哪天 */
.note-day { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-card); margin: 10px 0; overflow: hidden; box-shadow: var(--shadow); }
.note-day > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 18px; user-select: none; flex-wrap: wrap; }
.note-day > summary::-webkit-details-marker { display: none; }
.note-day > summary:hover { background: var(--bg-inset); }
.note-day .caret { color: var(--accent); font-size: 13px; transition: transform .15s; width: 14px; }
.note-day[open] .caret { transform: rotate(90deg); }
.note-day .dtitle { font-weight: 600; font-size: 16.5px; }
.note-day .dcount { color: var(--accent); font-size: 14px; font-weight: 600; }
.note-day .dpage { margin-left: auto; color: var(--ink-2); font-size: 13px; }
.note-body { padding: 6px 16px 16px; border-top: 1px solid var(--line); }

/* 词卡 */
.note-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 10px; margin-top: 10px; }
.nw { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--bg-inset); }
.nw-top { display: flex; align-items: baseline; gap: 8px; }
.nw-w { font-size: 19px; }
.nw-rank { font-size: 12px; color: var(--warn); letter-spacing: 1px; margin-left: auto; white-space: nowrap; }
.nw .phon-row { margin: 6px 0 4px; gap: 14px; }
.acc { font-style: normal; font-size: 11px; color: var(--accent); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.nw-gloss { font-size: 14.5px; margin: 4px 0 0; }
.nw-gloss i { color: var(--ink-2); }
.nw-pts { margin: 7px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-2); }
.nw-pts li { margin: 3px 0; }
.nw-memo { margin-top: 7px; font-size: 13.5px; color: var(--warn); }
.nw-rel { margin-top: 5px; font-size: 13px; color: var(--ink-2); }
.ng { border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 14px; margin-top: 10px; background: var(--bg-inset); }
.ng-title { font-weight: 600; color: var(--accent); margin-bottom: 6px; }
.ng-w { display: block; margin: 5px 0; font-size: 14.5px; line-height: 1.6; }
</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html">📚 五书词汇</a>
  <a class="tab" href="index.html">今日</a>
  <a class="tab" href="browse.html">词库</a>
  <a class="tab" href="wordbook.html">生词本</a>
  <a class="tab active" href="notes.html">生词笔记</a>
  <a class="tab" href="stats.html">统计</a>
  <a class="tab" href="settings.html">设置</a>
  <span class="spacer"></span>
  <button class="iconbtn" id="themeBtn" title="切换深浅色">🌙</button>
</nav>

<main>
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">📖 生词笔记</h2>
      <span id="noteSummary" style="margin-left:auto;color:var(--ink-2);font-size:14px"></span>
    </div>
    <p style="color:var(--ink-2);font-size:13.5px;margin:8px 0 0">点开日期查看当天的笔记 · 点击 🔊 听英 / 美发音</p>
  </div>

  <div id="noteDays"><p style="color:var(--ink-2)">加载中…</p></div>
</main>

<script type="module">
import { initTheme, setTheme, getTheme, icon, bindAudioButtons } from './assets/js/ui.js?v=17';
import { initAudio, pronounce, prefetchRealAudio } from './assets/js/audio.js?v=17';

initTheme(); initAudio();
document.getElementById('themeBtn').textContent = getTheme() === 'dark' ? '☀️' : '🌙';
document.getElementById('themeBtn').onclick = () => {
  const next = getTheme() === 'dark' ? 'light' : 'dark';
  setTheme(next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};
const $ = id => document.getElementById(id);

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const WEEK = ['日','一','二','三','四','五','六'];

function noteWordCard(w) {
  const ph = w.ph || {};
  return `<div class="nw">
    <div class="nw-top"><b class="nw-w">${esc(w.w)}</b>${w.rank ? `<span class="nw-rank">${'★'.repeat(w.rank)}</span>` : ''}</div>
    <div class="phon-row">
      ${ph.uk ? `<span class="phon"><button class="btn-audio" data-acc="uk" data-w="${esc(w.w)}" aria-label="${esc(w.w)} 英音">${icon('uk')}</button><span class="ph-text">/${esc(ph.uk)}/</span><i class="acc">英</i></span>` : ''}
      ${ph.us ? `<span class="phon"><button class="btn-audio" data-acc="us" data-w="${esc(w.w)}" aria-label="${esc(w.w)} 美音">${icon('us')}</button><span class="ph-text">/${esc(ph.us)}/</span><i class="acc">美</i></span>` : ''}
    </div>
    <div class="nw-gloss"><i>${esc(w.pos || '')}</i> ${esc(w.gloss || '')}</div>
    ${(w.points && w.points.length) ? `<ul class="nw-pts">${w.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
    ${w.memo ? `<div class="nw-memo">💡 ${esc(w.memo)}</div>` : ''}
    ${w.rel ? `<div class="nw-rel">${esc(w.rel)}</div>` : ''}
  </div>`;
}

function noteGroupCard(g) {
  return `<div class="ng">
    <div class="ng-title">⚡ 易混辨析 · ${esc(g.title)}</div>
    ${(g.words || []).map(x => `<span class="ng-w"><b>${esc(x.w)}</b> <button class="btn-audio" data-acc="uk" data-w="${esc(x.w)}" aria-label="${esc(x.w)} 发音">${icon('uk')}</button> <span class="ph-text">/${esc(x.ph || '')}/</span> ${esc(x.gloss || '')}${x.tip ? ` — ${esc(x.tip)}` : ''}</span>`).join('')}
    ${g.memo ? `<div class="nw-memo">💡 ${esc(g.memo)}</div>` : ''}
  </div>`;
}

async function load() {
  let j = null;
  const v = new Date().toISOString().slice(0, 10).replace(/-/g, '');   // 日期版缓存击穿
  try { const r = await fetch(`data/notes.json?v=${v}`); if (r.ok) j = await r.json(); } catch (e) {}
  const days = (j && Array.isArray(j.notes)) ? j.notes : [];
  if (!days.length) {
    $('noteDays').innerHTML = '<div class="card"><p style="color:var(--ink-2);margin:6px 0">暂无生词笔记</p></div>';
    return;
  }
  const total = days.reduce((n, d) => n + (d.words || []).length, 0);
  $('noteSummary').textContent = `共 ${days.length} 天 · ${total} 词`;

  // 日期由上到下：最新在最上；点哪天展开哪天（手风琴，同时只开一天，最新默认展开）
  const sorted = [...days].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  $('noteDays').innerHTML = sorted.map((d, i) => {
    const words = d.words || [], groups = d.groups || [];
    const dt = new Date(d.date + 'T00:00:00');
    const wd = isNaN(dt) ? '' : ' 周' + WEEK[dt.getDay()];
    return `<details class="note-day" data-date="${esc(d.date)}"${i === 0 ? ' open' : ''}>
      <summary>
        <span class="caret">▶</span>
        <span class="dtitle">📝 ${esc(d.date)}${wd}</span>
        <span class="dcount">${words.length} 词</span>
        <span class="dpage">${esc(d.label || '')}</span>
      </summary>
      <div class="note-body">
        <div class="note-grid">${words.map(noteWordCard).join('')}</div>
        ${groups.map(noteGroupCard).join('')}
      </div>
    </details>`;
  }).join('');

  bindAudioButtons($('noteDays'), pronounce);

  // 手风琴：展开某天时收起其他天，并预取当天真人音频
  const box = $('noteDays');
  box.addEventListener('toggle', e => {
    const day = e.target;
    if (!day.matches || !day.matches('details.note-day') || !day.open) return;
    box.querySelectorAll('details.note-day[open]').forEach(d => { if (d !== day) d.open = false; });
    const rec = days.find(x => x.date === day.dataset.date);
    for (const w of ((rec && rec.words) || [])) prefetchRealAudio(w.w);
  }, true);   // toggle 不冒泡，用捕获

  // 默认展开的最新一天也预取
  const firstRec = sorted[0];
  for (const w of ((firstRec && firstRec.words) || [])) prefetchRealAudio(w.w);
}

load();
</script>
</body>
</html>
