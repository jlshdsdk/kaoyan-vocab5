<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词义辨析 · 考研五书词汇</title>
<link rel="stylesheet" href="assets/css/base.css?v=19">
<style>
/* 板块切换：近义 / 近形 */
.seg2 { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
.seg2 .btn { flex: 1; min-width: 140px; padding: 12px 16px; font-size: 16px; }
.seg2 .btn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* 对比组卡片：可折叠式（details/summary），每页 15 组超出翻页 */
html { interpolate-size: allow-keywords; }   /* 支持的浏览器：height auto 平滑过渡，展开不跳 */
.cgroup { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-card); margin: 10px 0; box-shadow: var(--shadow); overflow: hidden; }
.cgroup > summary { cursor: pointer; user-select: none; list-style: none; }
.cgroup > summary::-webkit-details-marker { display: none; }
.cgroup > summary::marker { content: ''; }
.cgroup > summary:hover { background: var(--bg-inset); }
/* 组头边框常驻透明（收起/展开零高度差，消除 1px 抖动） */
.cgroup > summary .cg-head { padding: 14px 18px; border-bottom: 1px solid transparent; }
.cgroup[open] > summary .cg-head { border-bottom-color: var(--line); }
/* 展开高度动画：不支持 ::details-content / interpolate-size 的浏览器自动退化为瞬时展开（无回归） */
.cgroup::details-content { block-size: 0; overflow: hidden; transition: block-size .28s ease; }
.cgroup[open]::details-content { block-size: auto; }
.cg-body { padding: 0 0 2px; }
.pgr { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px 0 4px; }
.pgr .btn { padding: 6px 18px; font-size: 14px; }
.pginfo { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.cg-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.cg-head h3 { margin: 0; font-size: 17px; flex: 1 1 0; min-width: 0; }
.cg-tag { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; letter-spacing: 1px; white-space: nowrap; }
.cg-tag.syn { color: #1b5e20; background: #e8f5e9; }
.cg-tag.form { color: #b26a00; background: #fff3e0; }
:root[data-theme=dark] .cg-tag.syn, .dark .cg-tag.syn { color: #a5d6a7; background: rgba(76,175,80,.15); }
:root[data-theme=dark] .cg-tag.form, .dark .cg-tag.form { color: #ffcc80; background: rgba(255,152,0,.15); }
.cg-meta { margin-left: auto; color: var(--ink-2); font-size: 13px; white-space: nowrap; }

/* 词列 */
.cg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; padding: 12px 16px 4px; }
.cw { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--bg-inset); }
.cw-top { display: flex; align-items: baseline; gap: 8px; }
.cw-w { font-size: 19px; }
.cw-rank { font-size: 12px; color: var(--warn); letter-spacing: 1px; margin-left: auto; white-space: nowrap; }
.cw .phon-row { margin: 6px 0 4px; gap: 14px; }
.acc { font-style: normal; font-size: 11px; color: var(--accent); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.cw-gloss { font-size: 14.5px; margin: 4px 0 0; }
.cw-gloss i { color: var(--ink-2); }
.cw-usage { margin-top: 7px; font-size: 13.5px; color: var(--ink-2); }
.cw-usage b { color: var(--ink); font-weight: 600; }
.cw-ph { margin: 7px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-2); }
.cw-ph li { margin: 3px 0; }
.cw-ex { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.cw-ex .en { margin: 0; font-size: 13.5px; line-height: 1.6; }
.cw-ex .zh { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
.cg-memo { margin: 8px 18px 14px; padding: 10px 14px; border: 1px dashed var(--accent); border-radius: 10px; background: var(--bg-inset); color: var(--warn); font-size: 13.5px; line-height: 1.7; }
</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html">📚 五书词汇</a>
  <a class="tab" href="index.html">今日</a>
  <a class="tab" href="browse.html">词库</a>
  <a class="tab" href="wordbook.html">生词本</a>
  <a class="tab" href="notes.html">生词笔记</a>
  <a class="tab active" href="compare.html">词义辨析</a>
  <a class="tab" href="stats.html">统计</a>
  <a class="tab" href="settings.html">设置</a>
  <span class="spacer"></span><span id="authSlot"></span>
  <button class="iconbtn" id="themeBtn" title="切换深浅色">🌙</button>
</nav>

<main>
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">⚖️ 词义辨析</h2>
      <span id="cpSummary" style="margin-left:auto;color:var(--ink-2);font-size:14px"></span>
    </div>
    <p style="color:var(--ink-2);font-size:13.5px;margin:8px 0 0">近义词 / 近形词分组对比 · 每词含释义、发音、用法、搭配与例句</p>
  </div>

  <div class="seg2">
    <button class="btn on" id="tabSyn">近义辨析 <span id="synCount"></span></button>
    <button class="btn" id="tabForm">近形辨析 <span id="formCount"></span></button>
  </div>

  <div id="cpBody"><p style="color:var(--ink-2)">加载中…</p></div>
</main>

<script type="module">
import { initAuthNav } from './assets/js/auth-nav.js?v=18';
import { startSync } from './assets/js/sync.js?v=18';
import { initTheme, setTheme, getTheme, icon, bindAudioButtons } from './assets/js/ui.js?v=18';
import { initAudio, pronounce, prefetchRealAudio } from './assets/js/audio.js?v=24';

initAuthNav(); startSync();
initTheme(); initAudio();
document.getElementById('themeBtn').textContent = getTheme() === 'dark' ? '☀️' : '🌙';
document.getElementById('themeBtn').onclick = () => {
  const next = getTheme() === 'dark' ? 'light' : 'dark';
  setTheme(next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};
const $ = id => document.getElementById(id);

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let groups = { syn: [], form: [] };
let pane = 'syn';
const PAGE = 40;                                   // 每页组数，超出自动分页。近形已有 19 组，15 会把后面几组挤到第二页
const pgState = { syn: 0, form: 0 };               // 各板块当前页码

function wordCol(w) {
  const ph = w.ph || {};
  return `<div class="cw">
    <div class="cw-top"><b class="cw-w">${esc(w.w)}</b>${w.rank ? `<span class="cw-rank">${'★'.repeat(w.rank)}</span>` : ''}</div>
    <div class="phon-row">
      ${ph.uk ? `<span class="phon"><button class="btn-audio" data-acc="uk" data-w="${esc(w.w)}" aria-label="${esc(w.w)} 英音">${icon('uk')}</button><span class="ph-text">/${esc(ph.uk)}/</span><i class="acc">英</i></span>` : ''}
      ${ph.us ? `<span class="phon"><button class="btn-audio" data-acc="us" data-w="${esc(w.w)}" aria-label="${esc(w.w)} 美音">${icon('us')}</button><span class="ph-text">/${esc(ph.us)}/</span><i class="acc">美</i></span>` : ''}
    </div>
    <div class="cw-gloss"><i>${esc(w.pos || '')}</i> ${esc(w.gloss || '')}</div>
    ${w.usage ? `<div class="cw-usage"><b>用法</b> ${esc(w.usage)}</div>` : ''}
    ${(w.phrases && w.phrases.length) ? `<ul class="cw-ph">${w.phrases.map(p => `<li>▸ ${esc(p)}</li>`).join('')}</ul>` : ''}
    ${(w.ex && w.ex.length) ? `<div class="cw-ex">${w.ex.map(x => `<p class="en">${esc(x.en)}</p><p class="zh">${esc(x.zh)}</p>`).join('')}</div>` : ''}
  </div>`;
}

function groupCard(g, tag) {
  const words = g.words || [];
  return `<details class="cgroup" data-idx="${esc(String(g._idx))}">
    <summary>
      <div class="cg-head">
        <span class="cg-tag ${tag}">${tag === 'syn' ? '近义' : '近形'}</span>
        <h3>${esc(g.title || words.map(x => x.w).join(' · '))}</h3>
        <span class="cg-meta">${words.length} 词</span>
      </div>
    </summary>
    <div class="cg-body">
      <div class="cg-grid">${words.map(wordCol).join('')}</div>
      ${g.memo ? `<div class="cg-memo">💡 ${esc(g.memo)}</div>` : ''}
    </div>
  </details>`;
}

function pagerHTML(cur, total) {
  if (total <= 1) return '';
  return `<div class="pgr">
    <button class="btn pgbtn" data-pg="${cur - 1}" ${cur === 0 ? 'disabled' : ''}>‹ 上一页</button>
    <span class="pginfo">第 ${cur + 1} / ${total} 页</span>
    <button class="btn pgbtn" data-pg="${cur + 1}" ${cur === total - 1 ? 'disabled' : ''}>下一页 ›</button>
  </div>`;
}

function render() {
  const list = groups[pane] || [];
  const total = Math.max(1, Math.ceil(list.length / PAGE));
  if (pgState[pane] >= total) pgState[pane] = 0;
  const cur = pgState[pane];
  const slice = list.slice(cur * PAGE, cur * PAGE + PAGE).map((g, i) => ({ ...g, _idx: cur * PAGE + i }));
  $('tabSyn').classList.toggle('on', pane === 'syn');
  $('tabForm').classList.toggle('on', pane === 'form');
  $('cpBody').innerHTML = slice.length
    ? slice.map(g => groupCard(g, pane)).join('') + pagerHTML(cur, total)
    : `<div class="card"><p style="color:var(--ink-2);margin:6px 0">「${pane === 'syn' ? '近义' : '近形'}」板块还没有内容</p></div>`;
  // 预取用户手动展开的组的真人音频（默认全部折叠，不预取）
  for (const d of document.querySelectorAll('details.cgroup[open]')) {
    const g = slice[+d.dataset.idx - cur * PAGE];
    for (const w of ((g && g.words) || [])) prefetchRealAudio(w.w);
  }
}

async function load() {
  let j = null;
  const v = Date.now();   // 每次加载都取新（同日多次推送不再命中 CDN 旧缓存）   // 日期版缓存击穿
  try { const r = await fetch(`data/compare.json?v=${v}`); if (r.ok) j = await r.json(); } catch (e) {}
  groups = { syn: (j && j.syn) || [], form: (j && j.form) || [] };
  const nSyn = groups.syn.reduce((n, g) => n + (g.words || []).length, 0);
  const nForm = groups.form.reduce((n, g) => n + (g.words || []).length, 0);
  $('synCount').textContent = groups.syn.length ? `(${groups.syn.length} 组)` : '';
  $('formCount').textContent = groups.form.length ? `(${groups.form.length} 组)` : '';
  $('cpSummary').textContent = `近义 ${nSyn} 词 · 近形 ${nForm} 词`;
  render();
}

$('tabSyn').onclick = () => { pane = 'syn'; render(); };
$('tabForm').onclick = () => { pane = 'form'; render(); };

// 翻页与展开：事件委托
$('cpBody').addEventListener('click', e => {
  const btn = e.target.closest('.pgbtn');
  if (btn && !btn.disabled) {
    const next = Number(btn.dataset.pg);
    if (!Number.isNaN(next) && next >= 0) { pgState[pane] = next; render(); }
  }
});
$('cpBody').addEventListener('toggle', e => {
  const d = e.target;
  if (!d.matches || !d.matches('details.cgroup') || !d.open) return;
  const list = groups[pane] || [];
  const g = list[+d.dataset.idx];
  for (const w of ((g && g.words) || [])) prefetchRealAudio(w.w);
}, true);   // toggle 不冒泡，用捕获

bindAudioButtons(document, pronounce);
load();
</script>
</body>
</html>
