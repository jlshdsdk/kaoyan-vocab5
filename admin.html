<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号管理 · 考研五书词汇</title>
<link rel="stylesheet" href="assets/css/base.css?v=18">
<style>
.utable { width:100%; border-collapse:collapse; font-size:15px; }
.utable th, .utable td { text-align:left; padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
.utable th { color:var(--ink-2); font-weight:600; font-size:13px; letter-spacing:1px; }
.utable td .num { font-weight:700; }
.utable tr.me { background:color-mix(in srgb, var(--accent) 8%, transparent); }
.utable .ops { display:flex; gap:6px; flex-wrap:wrap; }
.utable .ops .btn { padding:5px 10px; font-size:13px; }
.banned { color:var(--bad); font-weight:600; }
.small { color:var(--ink-2); font-size:13px; }
@media (max-width:640px) {
  .utable th:nth-child(6), .utable td:nth-child(6) { display:none; }
}
</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html">📚 五书词汇</a>
  <a class="tab" href="index.html">今日</a>
  <a class="tab" href="browse.html">词库</a>
  <a class="tab" href="wordbook.html">生词本</a>
  <a class="tab" href="notes.html">生词笔记</a>
  <a class="tab" href="compare.html">词义辨析</a>
  <a class="tab" href="stats.html">统计</a>
  <a class="tab" href="settings.html">设置</a>
  <span class="spacer"></span>
  <span id="authSlot"></span>
  <button class="iconbtn" id="themeBtn" title="切换深浅色">🌙</button>
</nav>

<main>
  <div id="denied" class="card" hidden>
    <h2 style="margin:0 0 8px">🔒 无权访问</h2>
    <p style="color:var(--ink-2)">这个页面只有管理员（站长）能看到。
      <a href="login.html">去登录</a></p>
  </div>

  <div id="panel" hidden>
    <div class="card">
      <h2 style="margin:0 0 4px">👑 账号管理</h2>
      <p class="small" style="margin:0">只有你（管理员）能打开本页。可以查看每个账号的学习进度、禁用捣乱账号、重置某人的学习数据。
        密码由 Supabase 加密保管，任何人（包括你）都看不到明文。</p>
    </div>

    <div class="card">
      <div id="tblWrap" style="overflow-x:auto"><p class="small">加载中…</p></div>
    </div>
  </div>
</main>

<script type="module">
import { initTheme, setTheme, getTheme, toast, esc, fmtDate } from './assets/js/ui.js?v=18';
import { initAuthNav } from './assets/js/auth-nav.js?v=18';
import { cloudEnabled, getUser, getProfile, client } from './assets/js/auth.js?v=18';

initTheme();
initAuthNav();
const $ = id => document.getElementById(id);
$('themeBtn').textContent = getTheme() === 'dark' ? '☀️' : '🌙';
$('themeBtn').onclick = () => {
  const next = getTheme() === 'dark' ? 'light' : 'dark';
  setTheme(next);
  $('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};

let profiles = [], udata = new Map(), myId = null;

async function loadAll() {
  const sb = client();
  const [{ data: ps, error: e1 }, { data: us, error: e2 }] = await Promise.all([
    sb.from('profiles').select('*').order('created_at'),
    sb.from('user_data').select('user_id, updated_at, data'),
  ]);
  if (e1 || e2) { toast('读取失败：' + (e1?.message || e2?.message)); return false; }
  profiles = ps || [];
  udata = new Map((us || []).map(r => [r.user_id, r]));
  return true;
}

function statsOf(uid) {
  const row = udata.get(uid);
  if (!row?.data) return { learning: 0, grad: 0, fam: 0, sync: null };
  const d = row.data;
  return {
    learning: Object.keys(d.words || {}).length,
    grad: Object.keys(d.graduated || {}).length,
    fam: Object.keys(d.familiar || {}).length,
    sync: row.updated_at,
  };
}

function render() {
  const rows = profiles.map(p => {
    const st = statsOf(p.id);
    const me = p.id === myId;
    return `<tr class="${me ? 'me' : ''}">
      <td>${esc(p.nickname || '—')}${me ? ' <span class="small">（我）</span>' : ''}</td>
      <td>${esc(p.email || '—')}</td>
      <td>${p.is_admin ? '👑' : ''}${p.banned ? ' <span class="banned">已禁用</span>' : ''}</td>
      <td><span class="num">${st.learning}</span> 生词 · <span class="num">${st.grad}</span> 毕业 · <span class="num">${st.fam}</span> 熟悉</td>
      <td>${st.sync ? new Date(st.sync).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '<span class="small">从未同步</span>'}</td>
      <td>${p.created_at ? new Date(p.created_at).toLocaleDateString('zh-CN') : '—'}</td>
      <td><div class="ops">
        <button class="btn" data-ban="${p.id}" data-to="${p.banned ? '0' : '1'}">${p.banned ? '解禁' : '禁用'}</button>
        <button class="btn" data-reset="${p.id}" style="color:var(--bad)">重置进度</button>
      </div></td>
    </tr>`;
  }).join('');
  $('tblWrap').innerHTML = `<table class="utable">
    <thead><tr><th>昵称</th><th>邮箱</th><th>身份</th><th>学习进度</th><th>最近云同步</th><th>注册</th><th>操作</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="7" class="small">还没有任何注册用户</td></tr>'}</tbody></table>
    <p class="small" style="margin-top:10px">· 「禁用」后对方登录会被拒绝，数据保留；「重置进度」清空对方的生词本与复习记录（不可恢复）。<br>
    · 彻底删除账号：Supabase 控制台 → Authentication → Users → 删除用户。</p>`;

  $('tblWrap').querySelectorAll('[data-ban]').forEach(b => b.onclick = () => toggleBan(b.dataset.ban, b.dataset.to === '1'));
  $('tblWrap').querySelectorAll('[data-reset]').forEach(b => b.onclick = () => resetData(b.dataset.reset));
}

async function toggleBan(id, ban) {
  const p = profiles.find(x => x.id === id);
  if (!confirm(`确定${ban ? '禁用' : '解禁'}账号「${p?.nickname || p?.email}」？`)) return;
  const { error } = await client().from('profiles').update({ banned: ban }).eq('id', id);
  if (error) { toast('操作失败：' + error.message); return; }
  await loadAll(); render();
  toast(ban ? '已禁用' : '已解禁');
}

async function resetData(id) {
  const p = profiles.find(x => x.id === id);
  if (!confirm(`确定清空「${p?.nickname || p?.email}」的全部学习数据？不可恢复！`)) return;
  if (!confirm('再次确认：真的要清空吗？')) return;
  const { error } = await client().from('user_data').delete().eq('user_id', id);
  if (error) { toast('操作失败：' + error.message); return; }
  await loadAll(); render();
  toast('该用户的学习数据已清空');
}

(async function init() {
  if (!cloudEnabled) { $('denied').hidden = false; return; }
  const u = await getUser();
  if (!u) { $('denied').hidden = false; return; }
  const p = await getProfile();
  if (!p?.is_admin) { $('denied').hidden = false; return; }
  myId = u.id;
  if (await loadAll()) render();
  $('denied').hidden = true;
  $('panel').hidden = false;
})();
</script>
</body>
</html>
