<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收藏词 · 考研五书词汇</title>
<link rel="stylesheet" href="assets/css/base.css?v=19">
<style>
/* 收藏词页：紧凑词条卡（单词+词性+发音），点开滚动式详情，一行 2 词、每页 20 词分页 */
.favsearch { margin: 14px 0 4px; }
.favsearch input { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-card); color: var(--ink); font-size: 15px; outline: none; }
.favsearch input:focus { border-color: var(--accent); }
.favgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
@media (max-width: 640px) { .favgrid { grid-template-columns: 1fr; } }
.favcard { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-card); padding: 12px 14px; box-shadow: var(--shadow); cursor: pointer; }
.favcard:hover { border-color: var(--accent); }
.favhead { display: flex; align-items: center; gap: 8px; }
.favhead .favdel { margin-left: auto; }
.favsub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 3px; }
.favword { font-size: 21px; font-weight: 700; overflow-wrap: anywhere; }
.favpos { color: var(--accent); font-size: 13px; font-weight: 700; white-space: nowrap; }
.phonics { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.favcard .btn-audio { width: 27px; height: 27px; }
.favcard .ph-text { font-size: 14px; }
.favbtn { border: 0; background: none; cursor: pointer; font-size: 19px; line-height: 1; color: var(--ink-2); padding: 2px 5px; border-radius: 6px; }
.favbtn:hover { background: rgba(128,128,128,.15); }
.favbtn.on { color: #f5a623; }
.favchev { flex: none; color: var(--ink-2); font-size: 12px; transition: transform .15s; }
.favcard.open .favchev { transform: rotate(180deg); }
.favdetail { margin-top: 10px; max-height: 46vh; overflow: auto; border-top: 1px dashed var(--line); padding-top: 10px; cursor: auto; }
.favdetail .headword { font-size: clamp(22px, 3.5vw, 30px); }
.favdetail .phon-row { margin: 8px 0 2px; gap: 14px; }
.favdetail .sec { margin-top: 12px; }
.favdetail .books-row { margin-top: 12px; }
.favmemo { margin-top: 10px; font-size: 13.5px; color: var(--warn); border-top: 1px dashed var(--line); padding-top: 8px; }
.pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 18px 0 4px; }
.pgbtn { padding: 7px 16px; font-size: 14px; }
.pgbtn[disabled] { opacity: .45; cursor: default; pointer-events: none; }
.pginfo { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html">📚 五书词汇</a>
  <a class="tab" href="index.html">今日</a>
  <a class="tab" href="browse.html">词库</a>
  <a class="tab" href="wordbook.html">生词本</a>
  <a class="tab" href="notes.html">生词笔记</a>
  <a class="tab active" href="favorites.html">收藏词</a>
  <a class="tab" href="compare.html">词义辨析</a>
  <a class="tab" href="stats.html">统计</a>
  <a class="tab" href="settings.html">设置</a>
  <span class="spacer"></span><span id="authSlot"></span>
  <button class="iconbtn" id="themeBtn" title="切换深浅色">🌙</button>
</nav>

<main>
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">⭐ 收藏词</h2>
      <span id="favSummary" style="margin-left:auto;color:var(--ink-2);font-size:14px"></span>
    </div>
    <p style="color:var(--ink-2);font-size:13.5px;margin:8px 0 0">在「生词笔记」页点词卡右上角 ☆ 即可收藏到本页（随账号云同步）· 点词条展开详解 · 点击 🔊 听英 / 美发音</p>
  </div>

  <div class="favsearch"><input id="favSearch" placeholder="🔍 筛选收藏词：词头或已加载词条的释义关键词" aria-label="筛选收藏词"></div>
  <div id="favList"></div>
</main>

<script type="module">
import { initAuthNav } from './assets/js/auth-nav.js?v=18';
import { startSync } from './assets/js/sync.js?v=19';
import { initTheme, setTheme, getTheme, icon, toast, esc, cardBack, bindAudioButtons } from './assets/js/ui.js?v=18';
import { initAudio, pronounce, prefetchRealAudio } from './assets/js/audio.js?v=24';
import * as data from './assets/js/data.js?v=24';   // 词条按页懒取（chunk 缓存），详情点开即出
import * as store from './assets/js/store.js?v=20'; // state.favs（生词笔记页 ☆ 写入，随账号云同步）

initAuthNav(); startSync();
initTheme(); initAudio();
document.getElementById('themeBtn').textContent = getTheme() === 'dark' ? '☀️' : '🌙';
document.getElementById('themeBtn').onclick = () => {
  const next = getTheme() === 'dark' ? 'light' : 'dark';
  setTheme(next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};
const $ = id => document.getElementById(id);

const PAGE_SIZE = 20;            // 每页 20 词（一行 2 词 × 10 行）
let page = 1;                    // 当前页（1 起）
let renderEpoch = 0;             // 异步取词条后重绘前，页面可能已切换
const expanded = new Set();      // 展开了详情的词（跨翻页保留）
const entryCache = new Map();    // word -> 词条|null（null = 词库暂缺）
let memoMap = {};                // word -> [笔记memo,...]（静态 notes.json）
let memosLoaded = false;

async function loadMemos() {
  if (memosLoaded) return;
  try {
    const r = await fetch(`data/notes.json?v=${Date.now()}`);   // 每次会话取新，防 CDN 旧缓存
    if (r.ok) {
      const j = await r.json();
      const map = {};
      for (const day of (j.notes || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)))) {
        for (const w of (day.words || [])) if (w.memo) (map[w.w] = map[w.w] || []).push(w.memo);
      }
      memoMap = map;
    }
  } catch (e) {}
  memosLoaded = true;
}

async function ensureEntries(words) {
  await Promise.all(words.map(async w => {
    if (entryCache.has(w)) return;
    try { entryCache.set(w, await data.getEntry(w)); }
    catch (e) { entryCache.set(w, null); }   // 词库拉取失败也出降级卡，词头必须可见
  }));
}

const favItems = () => {
  const favs = store.getState().favs || {};
  return Object.entries(favs).map(([w, r]) => ({ w, at: (r && r.at) || 0 }))
    .sort((a, b) => b.at - a.at);            // 最新收藏在前
};

function filteredItems() {
  const q = $('favSearch').value.trim().toLowerCase();
  let items = favItems();
  if (q) items = items.filter(({ w }) => {
    const e = entryCache.get(w);             // 未加载词条的词只按词头匹配
    return (w + ' ' + ((e && (e.senses || []).join(' ')) || '')).toLowerCase().includes(q);
  });
  return items;
}

/** 词性：从 senses 前缀提取（最多 3 个去重） */
function posOf(entry) {
  if (!entry || !Array.isArray(entry.senses)) return '';
  const out = [];
  for (const s of entry.senses) {
    const str = typeof s === 'string' ? s : (s.pos || '');
    const m = String(str).match(/^(?:vt|vi|adj|adv|aux|art|conj|prep|pron|num|int|abbr|n|v)\./i);
    if (m) { const p = m[0].toLowerCase(); if (!out.includes(p)) out.push(p); }
    if (out.length >= 3) break;
  }
  return out.join(' / ');
}

const memoBlock = w => {
  const ms = memoMap[w];
  return ms && ms.length ? `<div class="favmemo">💡 ${esc(ms.join('；'))}</div>` : '';
};

function compactHTML(w, entry) {
  const pos = posOf(entry);
  const ph = (entry && entry.ph) || {};
  const strip = s => esc(String(s || '').replace(/^\/|\/$/g, ''));
  return `<div class="favhead">
      <b class="favword">${esc(w)}</b>
      <button class="favbtn on favdel" data-w="${esc(w)}" aria-label="取消收藏 ${esc(w)}" title="取消收藏">★</button>
      <span class="favchev">▼</span>
    </div>
    <div class="favsub">
      ${pos ? `<span class="favpos">${esc(pos)}</span>` : ''}
      <span class="phonics">
        ${ph.uk ? `<span class="phon"><button class="btn-audio" data-acc="uk" data-w="${esc(w)}" aria-label="${esc(w)} 英音">${icon('uk')}</button><span class="ph-text">/${strip(ph.uk)}/</span></span>` : ''}
        ${ph.us ? `<span class="phon"><button class="btn-audio" data-acc="us" data-w="${esc(w)}" aria-label="${esc(w)} 美音">${icon('us')}</button><span class="ph-text">/${strip(ph.us)}/</span></span>` : ''}
      </span>
    </div>`;
}

function cardHTML(w) {
  const entry = entryCache.get(w);
  const open = expanded.has(w);
  const detail = open
    ? `<div class="favdetail">${entry ? cardBack(entry) + memoBlock(w)
        : '<p style="color:var(--ink-2)">（词条数据暂缺，已保留收藏）</p>'}</div>`
    : '';
  return `<div class="favcard${open ? ' open' : ''}" data-w="${esc(w)}" role="button" tabindex="0" aria-expanded="${open}">
      ${compactHTML(w, entry)}${detail}
    </div>`;
}

/** 原位切换一张卡的展开/收起（不动其他卡，保住它们的滚动与音频按钮） */
function refreshCard(w) {
  const card = document.querySelector(`.favcard[data-w="${CSS.escape(w)}"]`);
  if (!card) return;
  const open = expanded.has(w);
  card.classList.toggle('open', open);
  card.setAttribute('aria-expanded', open);
  let d = card.querySelector('.favdetail');
  if (open) {
    const entry = entryCache.get(w);
    if (!d) { d = document.createElement('div'); d.className = 'favdetail'; card.appendChild(d); }
    d.innerHTML = entry ? cardBack(entry) + memoBlock(w) : '<p style="color:var(--ink-2)">（词条数据暂缺，已保留收藏）</p>';
  } else if (d) d.remove();
}

const pagerHTML = (tp, count) => `<div class="pager">
    <button class="btn pgbtn" id="pgPrev" ${page <= 1 ? 'disabled' : ''}>‹ 上一页</button>
    <span class="pginfo" id="pginfo">${page} / ${tp} 页 · 本页 ${count} 词</span>
    <button class="btn pgbtn" id="pgNext" ${page >= tp ? 'disabled' : ''}>下一页 ›</button>
  </div>`;

function renderList() {
  const total = favItems().length;
  $('favSummary').textContent = total ? `共 ${total} 词` : '';
  const items = filteredItems();
  const tp = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  if (page > tp) page = tp;
  if (page < 1) page = 1;
  if (!items.length) {
    $('favList').innerHTML = total
      ? '<div class="card"><p style="color:var(--ink-2);margin:6px 0">没有匹配的收藏词</p></div>'
      : '<div class="card"><p style="color:var(--ink-2);margin:6px 0">还没有收藏词 —— 到「生词笔记」页点词卡右上角的 ☆，收藏会出现在这里（随账号云同步）</p></div>';
    return;
  }
  const pageItems = items.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  const paint = () => {
    $('favList').innerHTML = `<div class="favgrid">${pageItems.map(it => cardHTML(it.w)).join('')}</div>
      ${tp > 1 ? pagerHTML(tp, pageItems.length) : ''}`;
    for (const it of pageItems) prefetchRealAudio(it.w);
  };
  paint();                                    // 先出紧凑卡（词条未到的暂缺词性/音标）
  const epoch = ++renderEpoch;
  ensureEntries(pageItems.map(it => it.w)).then(() => {
    if (epoch !== renderEpoch) return;        // 期间已翻页/重渲，丢弃
    paint();                                  // 词条到齐后补齐词性与音标
  });
}

async function load() {
  await loadMemos();
  renderList();
}

/* 交互 */
$('favSearch').addEventListener('input', () => { page = 1; renderList(); });

$('favList').addEventListener('click', e => {
  if (e.target.closest('.btn-audio')) return;             // 发音按钮由全局委托处理
  const del = e.target.closest('.favdel');
  if (del) {
    const w = del.dataset.w;
    if (!store.removeFav(w)) return;
    expanded.delete(w);
    renderList();
    toast(`已取消收藏「${w}」`);
    return;
  }
  if (e.target.closest('#pgPrev')) { page--; renderList(); return; }
  if (e.target.closest('#pgNext')) { page++; renderList(); return; }
  if (e.target.closest('.favdetail')) return;             // 详情区内点击/选中文字不收起
  const card = e.target.closest('.favcard');
  if (!card) return;
  const w = card.dataset.w;
  if (expanded.has(w)) expanded.delete(w); else expanded.add(w);
  refreshCard(w);                                          // 词条已在页缓存里，展开即时
});

$('favList').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.favcard');
  if (!card || e.target.closest('.favdetail')) return;
  e.preventDefault();
  const w = card.dataset.w;
  if (expanded.has(w)) expanded.delete(w); else expanded.add(w);
  refreshCard(w);
});

bindAudioButtons(document, pronounce);
load();

/* 云同步/其他标签页写入后自动重渲：新设备登录首同步晚于首渲，收藏也能及时出现 */
let reloadTimer = 0;
function scheduleReload() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(load, 500);
}
document.addEventListener('v5:flush', scheduleReload);
addEventListener('storage', e => { if (e.key === 'v5vocab.state.v1' && e.newValue) scheduleReload(); });
</script>
</body>
</html>
